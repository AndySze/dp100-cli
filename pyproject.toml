[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dp100-cli"
version = "0.1.0"
description = "Command-line tool and Python library for the ALIENTEK DP100 USB digital power supply"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Andy Sze" }]
keywords = ["dp100", "alientek", "power-supply", "usb", "hid", "lab", "bench"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = ["hidapi>=0.14"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
dp100 = "dp100.cli:main"

[project.urls]
Homepage = "https://github.com/AndySze/dp100-cli"
Issues = "https://github.com/AndySze/dp100-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dp100"]

[tool.hatch.build.targets.sdist]
include = ["src/dp100", "tests", "docs", "contrib", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
